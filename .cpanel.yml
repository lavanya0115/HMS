---
deployment:
  tasks:
    - export DEPLOYPATH=/home2/sreeanandham/public_html/
    
    # Clean deployment directory (remove this line if you want to keep existing files)
    - /bin/rm -rf $DEPLOYPATH/*
    
    # Copy all files from repository to public_html
    - /bin/cp -R * $DEPLOYPATH/
    - /bin/cp -R .[^.]* $DEPLOYPATH/ 2>/dev/null || true
    
    # Set proper permissions for Laravel
    - chmod -R 775 $DEPLOYPATH/storage/
    - chmod -R 775 $DEPLOYPATH/bootstrap/cache/
    
    # Install Composer dependencies (if composer.json exists)
    - cd $DEPLOYPATH && [ -f "composer.json" ] && composer install --no-dev --optimize-autoloader
    
    # Laravel optimizations (only if it's a Laravel project)
    - cd $DEPLOYPATH && [ -f "artisan" ] && php artisan config:cache
    - cd $DEPLOYPATH && [ -f "artisan" ] && php artisan route:cache
    - cd $DEPLOYPATH && [ -f "artisan" ] && php artisan view:cache
    - cd $DEPLOYPATH && [ -f "artisan" ] && php artisan migrate --force
    - cd $DEPLOYPATH && [ -f "artisan" ] && php artisan storage:link
    
    # General file permissions
    - /bin/find $DEPLOYPATH -type d -exec chmod 755 {} \;
    - /bin/find $DEPLOYPATH -type f -exec chmod 644 {} \;